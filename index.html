<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071321" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Preloader runs once per session; later page loads skip it before first paint.
      try {
        if (sessionStorage.getItem('blizad-seen')) document.documentElement.dataset.seen = '1'
        sessionStorage.setItem('blizad-seen', '1')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
